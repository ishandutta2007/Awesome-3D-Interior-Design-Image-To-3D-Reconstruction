<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Isometric Room Pattern -->
    <pattern id="isometricGrid" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
      <path d="M30 69.28 L60 86.6 L60 121.24 L30 138.56 L0 121.24 L0 86.6 Z" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beamPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .pulse-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-box {
      transform-origin: 980px 210px;
      animation: floatCube 7s ease-in-out infinite;
    }
    .wireframe-dash {
      stroke-dasharray: 6, 6;
      animation: dashMove 3s linear infinite;
    }
    .scanner-line {
      animation: scanline 5s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Isometric / Blueprint Grids -->
  <rect width="1200" height="420" fill="url(#grid)" />
  <rect x="650" y="0" width="550" height="420" fill="url(#isometricGrid)" opacity="0.45" />

  <!-- Ambient Glowing Background Orbs (Behind content) -->
  <circle cx="100" cy="80" r="140" fill="#38bdf8" filter="url(#glowCyan)" opacity="0.12" class="pulse-orb" />
  <circle cx="980" cy="210" r="180" fill="#a855f7" filter="url(#glowPurple)" opacity="0.18" class="pulse-orb" style="animation-delay: -3s;" />

  <!-- Animated Floor-plan / 3D Reconstruction Graphic on Right Side -->
  <g class="floating-box" id="spatialScene">
    <!-- Perspective Ground Plane Floor Plan Grid -->
    <polygon points="760,280 960,180 1140,240 940,350" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <polygon points="760,280 960,180 960,130 760,230" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill-opacity="0.4" />
    <polygon points="960,180 1140,240 1140,190 960,130" fill="#334155" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill-opacity="0.3" />

    <!-- 3D Architectural Room Wireframe (Cube Mesh) -->
    <!-- Room Base & Ceiling Bounds -->
    <line x1="820" y1="265" x2="820" y2="165" stroke="#818cf8" stroke-width="1.5" />
    <line x1="1060" y1="215" x2="1060" y2="115" stroke="#818cf8" stroke-width="1.5" />
    <line x1="940" y1="315" x2="940" y2="215" stroke="#38bdf8" stroke-width="2" />
    <line x1="940" y1="180" x2="940" y2="80" stroke="#c084fc" stroke-width="1.5" class="wireframe-dash" />

    <!-- Connecting Top Roof / Bounding Box -->
    <polygon points="820,165 940,80 1060,115 940,215" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.2" class="wireframe-dash" />

    <!-- Synthesized 3D Furniture Nodes (Bed / Sofa bounding box) -->
    <polygon points="880,260 970,225 1020,250 930,285" fill="#6366f1" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.5" />
    <polygon points="880,240 970,205 1020,230 930,265" fill="#818cf8" fill-opacity="0.6" stroke="#c084fc" stroke-width="1.5" />
    <line x1="880" y1="260" x2="880" y2="240" stroke="#818cf8" stroke-width="1.5" />
    <line x1="970" y1="225" x2="970" y2="205" stroke="#818cf8" stroke-width="1.5" />
    <line x1="1020" y1="250" x2="1020" y2="230" stroke="#818cf8" stroke-width="1.5" />
    <line x1="930" y1="285" x2="930" y2="265" stroke="#818cf8" stroke-width="1.5" />

    <!-- Reconstruction Ray Beams from Camera Origin -->
    <line x1="720" y1="90" x2="880" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="720" y1="90" x2="1020" y2="230" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="720" y1="90" x2="940" y2="315" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Camera / Scanner Node -->
    <circle cx="720" cy="90" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <circle cx="720" cy="90" r="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" class="pulse-orb" />

    <!-- 3D Coordinate Axis Gizmo -->
    <g transform="translate(1110, 80)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#ef4444" stroke-width="2.5" />
      <text x="34" y="4" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="bold">X</text>
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#22c55e" stroke-width="2.5" />
      <text x="-4" y="-34" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="bold">Y</text>
      <line x1="0" y1="0" x2="-18" y2="18" stroke="#3b82f6" stroke-width="2.5" />
      <text x="-26" y="28" fill="#3b82f6" font-family="sans-serif" font-size="10" font-weight="bold">Z</text>
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- Point Cloud / Gaussian Splat Dots -->
    <circle cx="850" cy="220" r="2.5" fill="#38bdf8" />
    <circle cx="890" cy="210" r="2" fill="#818cf8" />
    <circle cx="930" cy="190" r="2.5" fill="#c084fc" />
    <circle cx="980" cy="180" r="2" fill="#38bdf8" />
    <circle cx="1030" cy="200" r="3" fill="#a855f7" />
    <circle cx="910" cy="240" r="2" fill="#38bdf8" />
    <circle cx="950" cy="260" r="2.5" fill="#818cf8" />
  </g>

  <!-- Dynamic Vertical Scanline Effect across the Spatial Stage -->
  <line x1="680" y1="0" x2="1160" y2="0" stroke="url(#primaryGrad)" stroke-width="2" class="scanner-line" filter="url(#glowCyan)" />

  <!-- FOREGROUND CONTENT: Header, Pills, Description (Guaranteed High Contrast & Foreground Z-Index) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="18" fill="#a5b4fc" class="badge-text">SPATIAL AI &amp; ARCHITECTURAL 3D</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#primaryGrad)" font-size="44" class="title-text">
      Awesome 3D Interior Design
    </text>
    <text x="0" y="202" fill="#f8fafc" font-size="34" class="title-text">
      &amp; Image-To-3D Reconstruction
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="246" fill="#94a3b8" font-size="16" class="subtitle-text">
      Curated ecosystem of SaaS platforms, Generative AI models &amp; open-source engines
    </text>
    <text x="0" y="272" fill="#64748b" font-size="14.5" class="subtitle-text">
      for 2D/3D Floor Plan Drafting, Room Staging, Single-Photo 3D Mesh Synthesis &amp; WebGL Walkthroughs.
    </text>

    <!-- Dynamic Tech Feature Tags / Badges -->
    <g transform="translate(0, 316)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">📐 2D/3D Floor Plans</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect width="144" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600">🛋️ Spatial Room Staging</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(302, 0)">
        <rect width="146" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">⚡ Single-Image to 3D</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(458, 0)">
        <rect width="136" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">🌐 Three.js &amp; OpenBIM</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="0" y="380" width="560" height="2" fill="url(#primaryGrad)" rx="1" />
  </g>
</svg>
