ty:.75;transform:scale(1.08)}}@keyframes floatCube{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.8}}@keyframes beamPulse{0%{opacity:.2}50%{opacity:.8}}.pulse-orb{transform-origin:center;animation:pulseGlow 6s ease-in-out infinite}.floating-box{transform-origin:980px 210px;animation:floatCube 7s ease-in-out infinite}.wireframe-dash{stroke-dasharray:6,6;animation:dashMove 3s linear infinite}.scanner-line{animation:scanline 5s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400;letter-spacing:.2px}.badge-text{font-weight:600;font-size:11px;letter-spacing:.8px;text-transform:uppercase}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><rect width="550" height="420" x="650" y="0" fill="url(#isometricGrid)" opacity=".45"/><circle cx="100" cy="80" r="140" fill="#38bdf8" class="pulse-orb" filter="url(#glowCyan)" opacity=".12"/><circle cx="980" cy="210" r="180" fill="#a855f7" class="pulse-orb" filter="url(#glowPurple)" opacity=".18" style="animation-delay:-3s"/><g id="spatialScene" class="floating-box"><polygon fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.5" points="760 280 960 180 1140 240 940 350"/><polygon fill="#1e293b" fill-opacity=".4" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1" points="760 280 960 180 960 130 760 230"/><polygon fill="#334155" fill-opacity=".3" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1" points="960 180 1140 240 1140 190 960 130"/><line x1="820" x2="820" y1="265" y2="165" stroke="#818cf8" stroke-width="1.5"/><line x1="1060" x2="1060" y1="215" y2="115" stroke="#818cf8" stroke-width="1.5"/><line x1="940" x2="940" y1="315" y2="215" stroke="#38bdf8" stroke-width